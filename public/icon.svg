  </defs>
  
  <!-- App Icon Background Squircle -->
  <rect width="100" height="100" rx="24" fill="url(#bg)" />
  <circle cx="50" cy="45" r="32" fill="url(#halo)" />
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="23.25" stroke="url(#g1)" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Left Leg of 'A' as an Agricultural Stem -->
